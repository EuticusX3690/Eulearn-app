T.push({id:'cs',n:'Control Systems',e:'🎛️',d:'Keep machines under control',L:[
{t:'Open loop and closed loop',lv:'Beginner',b:'A control system makes a machine do what you want. Open loop: send a command and hope, like a toaster timer. Closed loop (feedback): measure the output, compare it with the target, and correct.\n\nA block diagram shows this. The target is the setpoint r. The error e = r - y, where y is the measured output. The controller turns e into an input u for the plant (the machine being controlled).',c:'r (target) -> (+/-) -> e -> Controller -> u -> Plant -> y (output)\n                ^                                      |\n                +--------------- sensor ---------------+\n\ne = r - y',qs:[['Which system uses feedback?',['Closed loop','Open loop','Neither'],0,'Feedback means measuring the output and correcting.'],['What is the error e?',['Target minus measured output','Output plus target','Controller gain'],0,'e = r - y.'],['In control, the plant is…',['The machine being controlled','The controller','The sensor'],0,'The plant is the process you control.']]},
{t:'First-order systems',lv:'Intermediate',b:'Many systems are first order: a heater, a motor speed, a tank filling. They move smoothly and slowly toward a final value. The transfer function is G(s) = K / (T s + 1). K is the gain (final output per unit input) and T is the time constant.\n\nAfter a step input, the output reaches 63 percent of its final value after one time constant T, and about 98 percent after 4T.',c:'G(s) = K / (T s + 1)\n\nK = 2, T = 5 s\nUnit step input -> final value = 2\nAt t = 5 s  -> 63 percent of 2 = 1.26\nAt t = 20 s -> about 98 percent',qs:[['In G(s) = K / (T s + 1), what is T?',['The time constant','The gain','The error'],0,'T sets how fast the system responds.'],['At t = T, the output reaches about…',['63 percent of final','100 percent','10 percent'],0,'That is the definition of the time constant.'],['K = 2 and a unit step input. What is the final value?',['2','1','5'],0,'Final value = K x input.']]},
{t:'Poles and stability',lv:'Intermediate',b:'The poles of a transfer function are the values of s that make the bottom equal to zero. They tell you how the system behaves. A pole at s = -a gives a response like e^(-at), which dies out. That is stable.\n\nA system is stable if all poles have negative real parts (the left half of the s plane). A pole with a positive real part grows without limit, and the system is unstable.',c:'G(s) = 1 / (s + 2)\npole: s + 2 = 0 -> s = -2 (stable)\n\nG(s) = 1 / (s - 3)\npole: s = +3 (unstable)\n\ns^2 + 3s + 2 = (s + 1)(s + 2)\npoles: -1 and -2 (stable)',qs:[['What are poles?',['Values of s that make the denominator zero','The motor terminals','The gain K'],0,'Solve the bottom of G(s) = 0.'],['G(s) = 1 / (s + 2) has which pole?',['-2','2','0'],0,'s + 2 = 0 gives s = -2.'],['When is a system stable?',['All poles have negative real parts','Any pole is positive','It has no input'],0,'Left half plane means stable.']]},
{t:'Response specifications',lv:'Intermediate',b:'We judge a response with a few numbers. Rise time: how fast it reaches the target. Overshoot: how far it goes past the target, in percent. Settling time: how long until it stays near the target (within 2 percent). Steady-state error: the leftover error at the end.\n\nGood design balances them. A faster response often means more overshoot.',c:'target = 100, peak = 120\novershoot = (120 - 100) / 100 = 20 percent\n\nsteady-state error = target - final\nfinal = 98 -> error = 2',qs:[['What is overshoot?',['How far the output goes past the target','How fast it starts','The sensor error'],0,'It is the peak above the target.'],['Target 100, peak 120. What is the overshoot?',['20 percent','120 percent','2 percent'],0,'(120 - 100) / 100.'],['What is steady-state error?',['Leftover error after settling','The first error','The noise'],0,'It is the error that remains at the end.']]},
{t:'P, I and D',lv:'Intermediate',b:'A PID controller adds three actions. P (proportional) pushes in proportion to the error now. I (integral) adds up past error, which removes steady-state error. D (derivative) reacts to how fast the error is changing, which reduces overshoot.\n\nToo much Kp causes oscillation, too much Ki causes overshoot, and too much Kd amplifies noise.',c:'u = Kp*e + Ki*sum(e) + Kd*de/dt\n\nP : present error\nI : past error (removes steady error)\nD : future trend (damps)',qs:[['Which term removes steady-state error?',['I','P','D'],0,'The integral keeps adding until the error is gone.'],['Which term damps overshoot?',['D','I','None of them'],0,'D reacts to the rate of change.'],['e = 10 and Kp = 2 (P only). What is u?',['20','5','12'],0,'u = Kp x e = 20.']]},
{t:'PID in code',lv:'Intermediate',b:'On a microcontroller we run PID in a loop at a fixed time step dt. Each loop: read the sensor, compute the error, update the integral (add e x dt), compute the derivative ((e - last) / dt), then combine them and send the result to the actuator.\n\nPractical tricks: limit the output (for example 0 to 255 for PWM), and limit the integral so it does not wind up when the actuator is saturated. This is called anti-windup.',c:'e = target - measured\nintegral += e * dt\nderiv = (e - last_e) / dt\nu = Kp*e + Ki*integral + Kd*deriv\nu = clamp(u, 0, 255)\nlast_e = e\n\ne = 10, last_e = 8, dt = 0.5\nderiv = (10 - 8) / 0.5 = 4',qs:[['Why limit the integral term?',['To stop windup when the output is saturated','To make it look nice','To save memory'],0,'Otherwise it keeps growing while the actuator is maxed out.'],['e = 10, last_e = 8, dt = 0.5. What is the derivative (e - last_e) / dt?',['4','2','20'],0,'(10 - 8) / 0.5 = 4.'],['Why clamp u between 0 and 255?',['PWM only accepts that range','To slow the loop','No reason'],0,'analogWrite takes 0 to 255.']]},
{t:'Tuning and stability margins',lv:'Advanced',b:'Tuning means choosing Kp, Ki and Kd. A simple method: raise Kp until the system oscillates steadily (this gain is Ku), measure the oscillation period (Tu), then use Ziegler-Nichols rules, for example Kp = 0.6 x Ku. Then fine-tune by testing.\n\nFor deeper analysis, engineers use root locus, Bode plots and Nyquist plots built from the Laplace model. They show how much extra gain you can add before the system becomes unstable (the gain margin).',c:'Ziegler-Nichols (PID):\nKp = 0.6 x Ku\n\nKu = 10 -> Kp = 6\n\nGain too high -> oscillation -> instability',qs:[['Ku = 10. What is Kp = 0.6 x Ku?',['6','0.6','16'],0,'0.6 x 10 = 6.'],['What happens if the gain is too high?',['Oscillation and possibly instability','Nothing','Faster and safer'],0,'High gain can destabilize a loop.'],['Which tools show the gain margin?',['Bode and Nyquist plots','Spreadsheets only','Paintbrush'],0,'They come from the Laplace model.']]}
]});

T.push({id:'sg',n:'Circuits and Signals',e:'📡',d:'AC, op-amps, filters and sampling',L:[
{t:'Kirchhoff’s laws',lv:'Intermediate',b:'Two laws solve almost every circuit. Kirchhoff’s current law (KCL): the current going into a node equals the current coming out. Kirchhoff’s voltage law (KVL): the voltages around any closed loop add up to zero.\n\nUse KVL to write one equation per loop and KCL at each junction, then solve the equations, just like the algebra you learned.',c:'12 V source, R1 = 4 ohm, R2 = 2 ohm in series\n\nKVL: 12 = I x 4 + I x 2\nI = 12 / 6 = 2 A\nVoltage across R1 = 2 x 4 = 8 V\n\nKCL: 5 A in, 2 A out of one branch\n-> 3 A leaves by the other branch',qs:[['KCL says the currents at a node…',['Going in equal those going out','Are always equal to each other','Are always 1 A'],0,'Charge is not stored at a node.'],['12 V source with 4 ohm and 2 ohm in series. What is the current?',['2 A','6 A','3 A'],0,'12 / (4 + 2) = 2 A.'],['KVL says the voltages around a loop…',['Add up to zero','Are always 12 V','Double each time'],0,'Sources and drops balance out.']]},
{t:'AC basics',lv:'Intermediate',b:'AC voltage is a sine wave. Its amplitude (peak), frequency f (cycles per second, in hertz) and period T = 1 / f describe it. Mains in many countries is 50 Hz.\n\nRMS is the equal heating value of an AC voltage. For a sine wave, Vrms = Vpeak / 1.414. Mains of 230 V RMS has a peak of about 325 V.',c:'T = 1 / f\nf = 50 Hz -> T = 20 ms\n\nVrms = Vpeak / 1.414\nVpeak = 325 V -> Vrms = 230 V',qs:[['The frequency is 50 Hz. What is the period?',['20 ms','50 ms','2 ms'],0,'1 / 50 = 0.02 s.'],['Vpeak = 100 V. What is Vrms?',['70.7 V','141 V','100 V'],0,'100 / 1.414.'],['What does RMS tell you?',['The equal DC heating value','The peak','The period'],0,'It compares AC to DC power.']]},
{t:'RC circuits and time constant',lv:'Intermediate',b:'A capacitor stores charge. Through a resistor it charges slowly. The time constant is tau = R x C. After one tau, the capacitor reaches 63 percent of the supply voltage, and after 5 tau it is almost full.\n\nThis is the same pattern as the first-order system in Control Systems. In steady DC, a capacitor blocks current, like an open circuit.',c:'tau = R x C\nR = 10 000 ohm, C = 100 uF = 0.0001 F\ntau = 10 000 x 0.0001 = 1 s\n\nt = 1 s  -> 63 percent\nt = 5 s  -> about 99 percent',qs:[['R = 10k and C = 100 uF. What is tau?',['1 s','10 s','0.1 s'],0,'10 000 x 0.0001 = 1.'],['After one tau, charging reaches about…',['63 percent','100 percent','37 percent'],0,'That is the time constant rule.'],['In steady DC, a capacitor acts like…',['An open circuit','A short circuit','A battery'],0,'No current flows once it is charged.']]},
{t:'Reactance and impedance',lv:'Intermediate',b:'In AC, coils and capacitors resist current in a way that depends on frequency. This is called reactance. Inductor: XL = 2 x pi x f x L, it grows with frequency. Capacitor: XC = 1 / (2 x pi x f x C), it shrinks with frequency.\n\nImpedance Z combines resistance and reactance. It is the AC version of resistance, and Ohm’s law still works: V = I x Z.',c:'XL = 2 pi f L\nL = 0.1 H, f = 50 Hz\nXL = 2 x 3.14 x 50 x 0.1 = 31.4 ohm\n\nXC = 1 / (2 pi f C)\nHigher f -> smaller XC',qs:[['As frequency rises, XL…',['Increases','Decreases','Stays the same'],0,'XL is proportional to f.'],['L = 0.1 H at 50 Hz. What is XL?',['31.4 ohm','5 ohm','314 ohm'],0,'2 x 3.14 x 50 x 0.1.'],['As frequency rises, a capacitor’s reactance…',['Decreases','Increases','Stays the same'],0,'XC = 1 / (2 pi f C).']]},
{t:'Op-amps',lv:'Advanced',b:'An operational amplifier (op-amp) has two inputs and one output. With negative feedback, an ideal op-amp follows two rules: no current flows into the inputs, and the two inputs sit at the same voltage.\n\nInverting amplifier: gain = -Rf / Rin. Non-inverting amplifier: gain = 1 + Rf / Rin. Op-amps amplify weak sensor signals before an Arduino reads them.',c:'Inverting:     gain = -Rf / Rin\nNon-inverting: gain = 1 + Rf / Rin\n\nRf = 10k, Rin = 1k\nInverting gain     = -10\nNon-inverting gain = 11',qs:[['Inverting amplifier with Rf = 10k and Rin = 1k. What is the gain?',['-10','10','11'],0,'-Rf / Rin = -10.'],['Non-inverting with the same resistors. What is the gain?',['11','10','-10'],0,'1 + 10 = 11.'],['Input 0.2 V into the inverting amplifier with gain -10. Output?',['-2 V','2 V','0.2 V'],0,'0.2 x -10 = -2.']]},
{t:'Filters',lv:'Advanced',b:'A filter passes some frequencies and blocks others. A low-pass filter passes low frequencies and blocks high ones, so it removes noise. A high-pass filter does the opposite. The simplest filter is a resistor and a capacitor.\n\nThe cutoff frequency is fc = 1 / (2 x pi x R x C). At fc, the output amplitude is about 70.7 percent of the input.',c:'fc = 1 / (2 pi R C)\n\nR = 1000 ohm, C = 159 nF\nfc = 1 / (2 x 3.14 x 1000 x 0.000000159)\nfc is about 1000 Hz (1 kHz)\n\nAt fc: output = 70.7 percent',qs:[['A low-pass filter passes…',['Low frequencies','High frequencies','Nothing'],0,'It blocks the high ones.'],['R = 1k and C = 159 nF. What is fc about?',['1 kHz','159 Hz','10 kHz'],0,'1 / (2 pi x 1000 x 159e-9) is close to 1000.'],['At the cutoff frequency the output amplitude is about…',['70.7 percent','50 percent','10 percent'],0,'That is the half-power point.']]},
{t:'Sampling and ADC',lv:'Advanced',b:'A computer reads signals by sampling: measuring at regular times. The Nyquist rule says you must sample at more than twice the highest frequency in the signal, or you get false low frequencies (aliasing).\n\nAn ADC (analog to digital converter) turns voltage into a number. An N-bit ADC has 2^N levels. The step size is Vref / 2^N. This links to the Fourier transform: to see frequencies, you first need good samples.',c:'Nyquist: fs > 2 x fmax\nfmax = 100 Hz -> fs > 200 Hz\n\n10-bit ADC: 2^10 = 1024 levels\nVref = 5 V\nstep = 5 / 1024 = 4.9 mV',qs:[['The signal has a maximum of 100 Hz. What sampling rate is needed?',['Above 200 Hz','50 Hz','100 Hz'],0,'More than twice the highest frequency.'],['How many levels does a 10-bit ADC have?',['1024','10','512'],0,'2^10 = 1024.'],['5 V reference and 10 bits. What is the step size?',['About 4.9 mV','About 49 mV','About 0.5 V'],0,'5 / 1024 = 0.0049 V.']]}
]});

T.push({id:'th',n:'Thermodynamics and Fluids',e:'🔥',d:'Heat, engines, pressure and flow',L:[
{t:'Heat and the first law',lv:'Beginner',b:'Heat is energy moving because of a temperature difference. To warm a material, heat Q = m x c x dT, where m is mass, c is the specific heat capacity, and dT is the temperature rise. Water has c = 4.18 kJ per kg per kelvin.\n\nThe first law of thermodynamics says energy is conserved: it only changes form. For a system, the change in internal energy equals heat added minus work done by the system.',c:'Q = m x c x dT\n\n2 kg of water, warmed by 10 K:\nQ = 2 x 4.18 x 10 = 83.6 kJ\n\nFirst law: dU = Q - W',qs:[['Heat needed to warm 2 kg of water by 10 K (c = 4.18 kJ/kg K)?',['83.6 kJ','8.36 kJ','41.8 kJ'],0,'2 x 4.18 x 10 = 83.6.'],['The first law says energy is…',['Conserved, it changes form','Created by engines','Always lost'],0,'Energy is not created or destroyed.'],['What does c stand for?',['Specific heat capacity','Speed of light','Cost'],0,'It is the heat needed per kg per kelvin.']]},
{t:'Ideal gas law',lv:'Beginner',b:'For a gas, pressure P, volume V and temperature T are linked: P x V = n x R x T. Always use absolute temperature in kelvin: K = degrees C + 273.\n\nIf the amount of gas stays the same, P1 x V1 / T1 = P2 x V2 / T2. At constant temperature, squeezing a gas into half the volume doubles its pressure. This is how compressed air and pneumatics work.',c:'K = C + 273\n27 C = 300 K\n\nConstant temperature:\nP1 x V1 = P2 x V2\n100 kPa x 2 m^3 = P2 x 1 m^3\nP2 = 200 kPa',qs:[['What is 27 degrees C in kelvin?',['300 K','27 K','246 K'],0,'27 + 273 = 300.'],['Why use kelvin in gas laws?',['The scale starts at absolute zero','It is easier to spell','Celsius is banned'],0,'Gas laws need true zero.'],['A gas at 100 kPa and 2 m^3 is squeezed to 1 m^3 at constant temperature. New pressure?',['200 kPa','50 kPa','100 kPa'],0,'P x V stays constant.']]},
{t:'Heat transfer',lv:'Intermediate',b:'Heat moves in 3 ways. Conduction: through a solid, from hot to cold. Convection: carried by a moving fluid, like a fan cooling a motor. Radiation: as infrared waves, even through empty space.\n\nConduction rate: q = k x A x dT / L, where k is conductivity, A is area, dT is the temperature difference and L is thickness. Insulators have a small k.',c:'q = k x A x dT / L\n\nSteel k = 50 W/m K\nA = 0.5 m^2, dT = 100 K, L = 0.1 m\nq = 50 x 0.5 x 100 / 0.1\nq = 25 000 W',qs:[['Which transfer needs direct contact in a solid?',['Conduction','Radiation','Convection'],0,'Conduction passes heat through the material.'],['k = 50, A = 0.5, dT = 100, L = 0.1. What is q?',['25 000 W','2 500 W','250 W'],0,'50 x 0.5 x 100 / 0.1.'],['Doubling the wall thickness L makes conduction…',['Half as much','Twice as much','The same'],0,'q is inversely proportional to L.']]},
{t:'Second law and efficiency',lv:'Intermediate',b:'A heat engine takes heat Qh from a hot source, turns some into work W, and must reject the rest Qc to a cold place. Efficiency = W / Qh = 1 - Qc / Qh.\n\nThe second law says no engine can be 100 percent efficient. The best possible is the Carnot efficiency: 1 - Tc / Th, with temperatures in kelvin. Car engines, power stations and refrigerators all follow it.',c:'Engine: Qh = 1000 kJ, Qc = 700 kJ\nW = 300 kJ\nefficiency = 300 / 1000 = 30 percent\n\nCarnot: Th = 600 K, Tc = 300 K\nefficiency = 1 - 300 / 600 = 50 percent',qs:[['An engine takes 1000 kJ and rejects 700 kJ. What is the efficiency?',['30 percent','70 percent','100 percent'],0,'Work = 300 kJ, so 300 / 1000.'],['Carnot with Th = 600 K and Tc = 300 K. What is the efficiency?',['50 percent','100 percent','200 percent'],0,'1 - 300 / 600.'],['The second law says no engine can be…',['100 percent efficient','Made of steel','Built in factories'],0,'Some heat must always be rejected.']]},
{t:'Fluid pressure',lv:'Intermediate',b:'Pressure in a fluid grows with depth: P = rho x g x h. Here rho is density (water 1000 kg per m^3), g is 9.81 and h is depth. Pressure acts equally in all directions.\n\nPascal’s law is the key to hydraulics: pressure applied to a confined fluid is passed on everywhere. So F1 / A1 = F2 / A2. A small force on a small piston gives a big force on a big piston.',c:'P = rho x g x h\n10 m of water:\nP = 1000 x 9.81 x 10 = 98 100 Pa\n   = about 98 kPa\n\nHydraulic: F1 / A1 = F2 / A2\nA1 = 0.01, A2 = 0.1, F1 = 100 N\nF2 = 100 x 0.1 / 0.01 = 1000 N',qs:[['Pressure from 10 m of water (rho 1000, g 9.81)?',['About 98 kPa','About 10 kPa','About 980 kPa'],0,'1000 x 9.81 x 10.'],['Hydraulic press: A1 = 0.01, A2 = 0.1, F1 = 100 N. What is F2?',['1000 N','10 N','100 N'],0,'The force scales with the area ratio of 10.'],['Pressure in a fluid increases with…',['Depth','Color','Pipe length only'],0,'P = rho x g x h.']]},
{t:'Fluid flow and Bernoulli',lv:'Intermediate',b:'Flow rate Q = A x v, where A is the pipe area and v is the speed. For an incompressible fluid, what flows in must flow out, so A1 x v1 = A2 x v2. When a pipe narrows, the fluid speeds up.\n\nBernoulli’s principle: along a flow, where the speed is higher, the pressure is lower. It explains wing lift, carburettors and flow meters.',c:'Q = A x v\nA = 0.02 m^2, v = 2 m/s\nQ = 0.04 m^3/s\n\nPipe narrows to A2 = 0.01:\nv2 = Q / A2 = 0.04 / 0.01 = 4 m/s\n\nFaster flow -> lower pressure',qs:[['Flow rate Q = A x v with A = 0.02 and v = 2. What is Q?',['0.04 m^3/s','0.01 m^3/s','4 m^3/s'],0,'0.02 x 2 = 0.04.'],['The pipe narrows to half the area with the same flow. The speed…',['Doubles','Halves','Stays the same'],0,'A1 x v1 = A2 x v2.'],['Bernoulli: where fluid moves faster, the pressure is…',['Lower','Higher','The same'],0,'Speed and pressure trade off.']]},
{t:'Pipes and pumps',lv:'Advanced',b:'The Reynolds number Re = rho x v x D / mu tells if flow is smooth (laminar, Re below about 2300) or chaotic (turbulent, Re above about 4000). Here D is the pipe diameter and mu is the viscosity. Turbulent flow loses more pressure to friction.\n\nA pump must lift the fluid by head H and overcome these losses. Pump input power = rho x g x Q x H / efficiency. Engineers use this to pick pumps for cooling water, hydraulics and mill lubrication systems.',c:'Re = rho x v x D / mu\nwater: 1000 x 1 x 0.05 / 0.001\nRe = 50 000 -> turbulent\n\nP = rho x g x Q x H / eta\nQ = 0.01 m^3/s, H = 20 m, eta = 0.7\nP = 1000 x 9.81 x 0.01 x 20 / 0.7\nP = about 2800 W (2.8 kW)',qs:[['Re = 50 000 means the flow is…',['Turbulent','Laminar','Stopped'],0,'Above about 4000 is turbulent.'],['rho 1000, g 9.81, Q 0.01, H 20, eta 0.7. What is the pump power?',['About 2.8 kW','About 1.96 kW','About 20 kW'],0,'1962 W / 0.7 is about 2800 W.'],['Why divide by the efficiency?',['Pumps waste some power','Water is heavy','Pipes are long'],0,'Input power must be larger than the useful power.']]}
]});
